<script>
/* ==========================================================================
   Classical Chess rules engine (port of pieces.py, board.py, game.py, timer.py)
   Squares are integers 0..63: row * 8 + col. Row 0 is rank 8, col 0 is the a-file.
   ========================================================================== */
const WHITE = "w", BLACK = "b";
const COLOR_NAMES = { w: "White", b: "Black" };
const PIECE_VALUES = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };
const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const FILES = "abcdefgh";
const RAPID_SECONDS = 600;
const LOW_TIME_THRESHOLD = 20;

const opposite = (c) => (c === WHITE ? BLACK : WHITE);
const inBounds = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const sqOf = (r, c) => r * 8 + c;
const rowOf = (s) => s >> 3;
const colOf = (s) => s & 7;
const squareName = (s) => FILES[colOf(s)] + (8 - rowOf(s));
function parseSquare(name) {
  name = String(name).trim().toLowerCase();
  if (name.length !== 2 || !FILES.includes(name[0]) || !"12345678".includes(name[1]))
    throw new Error("Invalid square name: " + name);
  return sqOf(8 - Number(name[1]), FILES.indexOf(name[0]));
}
const isLightSquare = (s) => (rowOf(s) + colOf(s)) % 2 === 0;

function makeMove(start, end, opts = {}) {
  return { start, end, promotion: opts.promotion || null,
           isEnPassant: !!opts.isEnPassant, isCastle: !!opts.isCastle,
           isDoublePush: !!opts.isDoublePush };
}
const moveUci = (m) => squareName(m.start) + squareName(m.end) + (m.promotion ? m.promotion.toLowerCase() : "");

/* ---------------------------------------------------------------- pieces */
class Piece {
  constructor(color, hasMoved = false) {
    if (color !== WHITE && color !== BLACK) throw new Error("Invalid colour");
    this.color = color;
    this.hasMoved = hasMoved;
  }
  get value() { return PIECE_VALUES[this.kind]; }
  get symbol() { return this.color === WHITE ? this.kind : this.kind.toLowerCase(); }
  clone() { return new this.constructor(this.color, this.hasMoved); }
  isEnemyOrEmpty(board, t) { const o = board.pieceAt(t); return !o || o.color !== this.color; }
}

const ORTHO = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
const KNIGHT_OFFSETS = [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]];

class SlidingPiece extends Piece {
  attacks(board, s) {
    const out = [], r0 = rowOf(s), c0 = colOf(s);
    for (const [dr, dc] of this.directions) {
      let r = r0 + dr, c = c0 + dc;
      while (inBounds(r, c)) {
        const t = sqOf(r, c);
        out.push(t);
        if (board.grid[t]) break;
        r += dr; c += dc;
      }
    }
    return out;
  }
  pseudoLegalMoves(board, s) {
    return this.attacks(board, s).filter((t) => this.isEnemyOrEmpty(board, t)).map((t) => makeMove(s, t));
  }
}
class LeapingPiece extends Piece {
  attacks(board, s) {
    const out = [], r0 = rowOf(s), c0 = colOf(s);
    for (const [dr, dc] of this.offsets) if (inBounds(r0 + dr, c0 + dc)) out.push(sqOf(r0 + dr, c0 + dc));
    return out;
  }
  pseudoLegalMoves(board, s) {
    return this.attacks(board, s).filter((t) => this.isEnemyOrEmpty(board, t)).map((t) => makeMove(s, t));
  }
}
class Rook extends SlidingPiece {}
Rook.prototype.kind = "R"; Rook.prototype.directions = ORTHO;
class Bishop extends SlidingPiece {}
Bishop.prototype.kind = "B"; Bishop.prototype.directions = DIAG;
class Queen extends SlidingPiece {}
Queen.prototype.kind = "Q"; Queen.prototype.directions = ORTHO.concat(DIAG);
class Knight extends LeapingPiece {}
Knight.prototype.kind = "N"; Knight.prototype.offsets = KNIGHT_OFFSETS;

class King extends LeapingPiece {
  pseudoLegalMoves(board, s) {
    return super.pseudoLegalMoves(board, s).concat(this.castlingMoves(board, s));
  }
  castlingMoves(board, s) {
    const home = this.color === WHITE ? 7 : 0;
    if (s !== sqOf(home, 4)) return [];
    const rights = board.castlingRights;
    const [ks, qs] = this.color === WHITE ? ["K", "Q"] : ["k", "q"];
    if (!rights.has(ks) && !rights.has(qs)) return [];
    const enemy = opposite(this.color);
    if (board.isSquareAttacked(s, enemy)) return [];
    const moves = [];
    const rookReady = (c) => { const p = board.grid[sqOf(home, c)]; return p instanceof Rook && p.color === this.color; };
    const empty = (cols) => cols.every((c) => !board.grid[sqOf(home, c)]);
    const safe = (cols) => !cols.some((c) => board.isSquareAttacked(sqOf(home, c), enemy));
    if (rights.has(ks) && rookReady(7) && empty([5, 6]) && safe([5, 6]))
      moves.push(makeMove(s, sqOf(home, 6), { isCastle: true }));
    if (rights.has(qs) && rookReady(0) && empty([1, 2, 3]) && safe([2, 3]))
      moves.push(makeMove(s, sqOf(home, 2), { isCastle: true }));
    return moves;
  }
}
King.prototype.kind = "K"; King.prototype.offsets = ORTHO.concat(DIAG);

class Pawn extends Piece {
  get direction() { return this.color === WHITE ? -1 : 1; }
  get startRow() { return this.color === WHITE ? 6 : 1; }
  get promotionRow() { return this.color === WHITE ? 0 : 7; }
  attacks(board, s) {
    const out = [], tr = rowOf(s) + this.direction, c = colOf(s);
    for (const dc of [-1, 1]) if (inBounds(tr, c + dc)) out.push(sqOf(tr, c + dc));
    return out;
  }
  withPromotions(start, end, flags = {}) {
    if (rowOf(end) === this.promotionRow)
      return ["Q", "R", "B", "N"].map((p) => makeMove(start, end, { ...flags, promotion: p }));
    return [makeMove(start, end, flags)];
  }
  pseudoLegalMoves(board, s) {
    const moves = [], r = rowOf(s), c = colOf(s);
    const r1 = r + this.direction;
    if (inBounds(r1, c) && !board.grid[sqOf(r1, c)]) {
      moves.push(...this.withPromotions(s, sqOf(r1, c)));
      const r2 = r + 2 * this.direction;
      if (r === this.startRow && !board.grid[sqOf(r2, c)])
        moves.push(makeMove(s, sqOf(r2, c), { isDoublePush: true }));
    }
    for (const t of this.attacks(board, s)) {
      const occ = board.grid[t];
      if (occ && occ.color !== this.color) moves.push(...this.withPromotions(s, t));
      else if (!occ && t === board.enPassant) {
        const victim = board.grid[sqOf(r, colOf(t))];
        if (victim instanceof Pawn && victim.color !== this.color)
          moves.push(makeMove(s, t, { isEnPassant: true }));
      }
    }
    return moves;
  }
}
Pawn.prototype.kind = "P";

const PIECE_CLASSES = { P: Pawn, N: Knight, B: Bishop, R: Rook, Q: Queen, K: King };
function createPiece(kind, color, hasMoved = false) {
  const cls = PIECE_CLASSES[String(kind).toUpperCase()];
  if (!cls) throw new Error("Unknown piece kind: " + kind);
  return new cls(color, hasMoved);
}
const pieceFromSymbol = (ch) => createPiece(ch.toUpperCase(), ch === ch.toUpperCase() ? WHITE : BLACK);

/* ----------------------------------------------------------------- board */
const ROOK_CORNERS = { [sqOf(7, 7)]: "K", [sqOf(7, 0)]: "Q", [sqOf(0, 7)]: "k", [sqOf(0, 0)]: "q" };
const CASTLING_ORDER = "KQkq";

class Board {
  constructor(fen = START_FEN) {
    this.grid = new Array(64).fill(null);
    this.turn = WHITE;
    this.castlingRights = new Set();
    this.enPassant = null;
    this.halfmove = 0;
    this.fullmove = 1;
    if (fen) this.loadFen(fen);
  }
  copy() {
    const b = new Board(null);
    b.grid = this.grid.map((p) => (p ? p.clone() : null));
    b.turn = this.turn;
    b.castlingRights = new Set(this.castlingRights);
    b.enPassant = this.enPassant;
    b.halfmove = this.halfmove;
    b.fullmove = this.fullmove;
    return b;
  }
  pieceAt(s) { return this.grid[s]; }
  setPiece(s, p) { this.grid[s] = p; }
  pieces(color = null) {
    const out = [];
    for (let s = 0; s < 64; s++) {
      const p = this.grid[s];
      if (p && (color === null || p.color === color)) out.push([s, p]);
    }
    return out;
  }
  findKing(color) {
    for (let s = 0; s < 64; s++) { const p = this.grid[s]; if (p instanceof King && p.color === color) return s; }
    return null;
  }
  isSquareAttacked(square, byColor) {
    for (let s = 0; s < 64; s++) {
      const p = this.grid[s];
      if (p && p.color === byColor && p.attacks(this, s).includes(square)) return true;
    }
    return false;
  }
  inCheck(color) {
    const k = this.findKing(color);
    return k !== null && this.isSquareAttacked(k, opposite(color));
  }
  makeMove(move) {
    const { start, end } = move;
    const piece = this.grid[start];
    if (!piece) throw new Error("No piece on " + squareName(start));
    const isPawn = piece instanceof Pawn;
    const isCastle = piece instanceof King && Math.abs(colOf(end) - colOf(start)) === 2;
    const isEnPassant = isPawn && colOf(start) !== colOf(end) && !this.grid[end] && end === this.enPassant;
    const isDoublePush = isPawn && Math.abs(rowOf(end) - rowOf(start)) === 2;

    let capturedSquare = isEnPassant ? sqOf(rowOf(start), colOf(end)) : end;
    const captured = this.grid[capturedSquare];
    if (!captured) capturedSquare = null;
    else if (capturedSquare !== end) this.grid[capturedSquare] = null;

    this.grid[start] = null;
    let placed = piece;
    const isPromotion = isPawn && (rowOf(end) === 0 || rowOf(end) === 7);
    if (isPromotion) placed = createPiece(move.promotion || "Q", piece.color, true);
    else piece.hasMoved = true;
    this.grid[end] = placed;

    let rookMove = null;
    if (isCastle) {
      const r = rowOf(start);
      const [from, to] = colOf(end) === 6 ? [sqOf(r, 7), sqOf(r, 5)] : [sqOf(r, 0), sqOf(r, 3)];
      const rook = this.grid[from];
      this.grid[from] = null;
      this.grid[to] = rook;
      if (rook) rook.hasMoved = true;
      rookMove = [from, to];
    }

    if (piece instanceof King) {
      for (const r of piece.color === WHITE ? ["K", "Q"] : ["k", "q"]) this.castlingRights.delete(r);
    }
    for (const corner of [start, end]) { const r = ROOK_CORNERS[corner]; if (r) this.castlingRights.delete(r); }

    this.enPassant = isDoublePush ? sqOf((rowOf(start) + rowOf(end)) >> 1, colOf(start)) : null;
    this.halfmove = isPawn || captured ? 0 : this.halfmove + 1;
    if (this.turn === BLACK) this.fullmove += 1;
    this.turn = opposite(this.turn);
    return { move, piece, placed, captured: captured || null, capturedSquare, rookMove,
             isCastle, isEnPassant, isPromotion };
  }
  loadFen(fen) {
    const f = fen.trim().split(/\s+/);
    if (f.length < 4) throw new Error("Invalid FEN");
    const [placement, turn, castling, ep] = f;
    const ranks = placement.split("/");
    if (ranks.length !== 8) throw new Error("FEN placement must have 8 ranks");
    this.grid = new Array(64).fill(null);
    ranks.forEach((rank, r) => {
      let c = 0;
      for (const ch of rank) {
        if (/\d/.test(ch)) c += Number(ch);
        else { if (c > 7) throw new Error("Too many squares in FEN rank"); this.grid[sqOf(r, c)] = pieceFromSymbol(ch); c++; }
      }
      if (c !== 8) throw new Error("FEN rank does not have 8 squares");
    });
    if (turn !== WHITE && turn !== BLACK) throw new Error("FEN side to move must be w or b");
    this.turn = turn;
    this.castlingRights = new Set(castling === "-" ? [] : [...castling].filter((c) => CASTLING_ORDER.includes(c)));
    this.enPassant = ep === "-" ? null : parseSquare(ep);
    this.halfmove = Number(f[4] ?? 0);
    this.fullmove = Number(f[5] ?? 1);
    for (const [s, p] of this.pieces()) {
      if (p instanceof Pawn) p.hasMoved = rowOf(s) !== p.startRow;
      else if (p instanceof King) {
        const home = p.color === WHITE ? sqOf(7, 4) : sqOf(0, 4);
        const rights = p.color === WHITE ? ["K", "Q"] : ["k", "q"];
        p.hasMoved = s !== home || !rights.some((r) => this.castlingRights.has(r));
      } else {
        const r = ROOK_CORNERS[s];
        p.hasMoved = !(r && this.castlingRights.has(r) && p.kind === "R");
      }
    }
  }
  placementFen() {
    const rows = [];
    for (let r = 0; r < 8; r++) {
      let out = "", empty = 0;
      for (let c = 0; c < 8; c++) {
        const p = this.grid[sqOf(r, c)];
        if (!p) empty++;
        else { if (empty) { out += empty; empty = 0; } out += p.symbol; }
      }
      if (empty) out += empty;
      rows.push(out);
    }
    return rows.join("/");
  }
  castlingFen() { return [...CASTLING_ORDER].filter((c) => this.castlingRights.has(c)).join("") || "-"; }
  toFen() {
    const ep = this.enPassant === null ? "-" : squareName(this.enPassant);
    return `${this.placementFen()} ${this.turn} ${this.castlingFen()} ${ep} ${this.halfmove} ${this.fullmove}`;
  }
  positionKey() {
    let ep = "-";
    if (this.enPassant !== null) {
      const pr = rowOf(this.enPassant) + (this.turn === WHITE ? 1 : -1);
      for (const dc of [-1, 1]) {
        const c = colOf(this.enPassant) + dc;
        if (inBounds(pr, c)) {
          const p = this.grid[sqOf(pr, c)];
          if (p instanceof Pawn && p.color === this.turn) { ep = squareName(this.enPassant); break; }
        }
      }
    }
    return `${this.placementFen()} ${this.turn} ${this.castlingFen()} ${ep}`;
  }
}

/* ------------------------------------------------------------------ rules */
const ONGOING = "ongoing", CHECKMATE = "checkmate", STALEMATE = "stalemate",
  INSUFFICIENT_MATERIAL = "insufficient_material", THREEFOLD_REPETITION = "threefold_repetition",
  FIFTY_MOVE_RULE = "fifty_move_rule", RESIGNATION = "resignation", DRAW_AGREEMENT = "draw_agreement",
  TIMEOUT = "timeout", TIMEOUT_VS_INSUFFICIENT = "timeout_vs_insufficient_material";

const REASON_TEXT = {
  [CHECKMATE]: "by checkmate", [STALEMATE]: "by stalemate",
  [INSUFFICIENT_MATERIAL]: "by insufficient material", [THREEFOLD_REPETITION]: "by threefold repetition",
  [FIFTY_MOVE_RULE]: "by the 50-move rule", [RESIGNATION]: "by resignation",
  [DRAW_AGREEMENT]: "by agreement", [TIMEOUT]: "on time",
  [TIMEOUT_VS_INSUFFICIENT]: "timeout vs insufficient material",
};

function isMoveSafe(board, move, color) {
  const sim = board.copy();
  sim.makeMove(move);
  return !sim.inCheck(color);
}
function generateLegalMoves(board, color = null) {
  color = color || board.turn;
  const legal = [];
  for (const [s, p] of board.pieces(color))
    for (const m of p.pseudoLegalMoves(board, s)) if (isMoveSafe(board, m, color)) legal.push(m);
  return legal;
}
function isInsufficientMaterial(board) {
  const minors = [];
  for (const [s, p] of board.pieces()) {
    if (p instanceof King) continue;
    if (p instanceof Knight || p instanceof Bishop) minors.push([s, p]);
    else return false;
  }
  if (minors.length <= 1) return true;
  if (minors.every(([, p]) => p instanceof Bishop))
    return new Set(minors.map(([s]) => isLightSquare(s))).size === 1;
  return false;
}
function canCheckmate(board, color) {
  const mat = board.pieces(color).map(([, p]) => p).filter((p) => !(p instanceof King));
  if (!mat.length) return false;
  if (mat.length === 1 && (mat[0] instanceof Knight || mat[0] instanceof Bishop)) return false;
  return true;
}
function moveToSan(board, move, legalMoves) {
  const piece = board.grid[move.start];
  if (piece instanceof King && Math.abs(colOf(move.end) - colOf(move.start)) === 2)
    return colOf(move.end) === 6 ? "O-O" : "O-O-O";
  const target = squareName(move.end);
  if (piece instanceof Pawn) {
    let san = colOf(move.start) !== colOf(move.end) ? squareName(move.start)[0] + "x" + target : target;
    if (move.promotion) san += "=" + move.promotion;
    return san;
  }
  const isCapture = !!board.grid[move.end];
  const rivals = legalMoves.filter((m) => m.end === move.end && m.start !== move.start &&
    board.grid[m.start] && board.grid[m.start].kind === piece.kind).map((m) => m.start);
  let dis = "";
  if (rivals.length) {
    const name = squareName(move.start);
    if (rivals.every((r) => colOf(r) !== colOf(move.start))) dis = name[0];
    else if (rivals.every((r) => rowOf(r) !== rowOf(move.start))) dis = name[1];
    else dis = name;
  }
  return piece.kind + dis + (isCapture ? "x" : "") + target;
}

class Game {
  constructor(whiteName = "White", blackName = "Black", fen = START_FEN) {
    this.whiteName = whiteName;
    this.blackName = blackName;
    this.board = new Board(fen);
    this.history = [];
    this.captured = { w: [], b: [] };
    this.positionCounts = new Map([[this.board.positionKey(), 1]]);
    this.outcome = null;
    this._legal = null;
    this._evaluate();
  }
  get turn() { return this.board.turn; }

    const parts = [[font(17, true), "10:00 Rapid", C.TEXT], [font(17), "   |   ", C.TEXT_MUTED], [font(17, true), "Rule-Enforced", C.LIGHT]];
    const total = 28 + parts.reduce((s, [f, t]) => s + textWidth(t, f), 0);
    let x = pill.cx - total / 2;
    drawIcon("clock", x + 10, pill.cy, 20, C.LIGHT, { angle: 60 });
    x += 28;
    for (const [f, t, c] of parts) x = blitText(t, f, c, "midleft", x, pill.cy).right;
    ["Castling · En passant · Promotion · Checkmate · Stalemate",

}

  }
  enter() {

          this.game.makeMove(parseSquare(uci.slice(0, 2)), parseSquare(uci.slice(2, 4)), promo);
        }
        if (this.restore.times) Object.assign(this.clock.remaining, this.restore.times);
      } catch (e) { this.game = new Game(this.game.whiteName, this.game.blackName); }
      this.restore = null;
      if (this.game.isOver) { this.saved = true; this.openResultModal(); return; }
      this.clock.start(this.game.turn);

  exit() { this.clock.stop(); }

  toggleMute() {

      if (this.drawBtn.handle(ev)) return this.requestDraw();
    } else if (this.resultBtn.handle(ev)) return this.openResultModal();

    const inStrip = ev.pos && ev.pos[1] >= MOVE_BAR_Y && ev.pos[1] < MOVE_BAR_Y + MOVE_BAR_H;
    const maxScroll = Math.max(0, this.tokensWidth - (W - 14));

    const p = this.game.board.pieceAt(s);

  execute(start, end, promotion, animate) {

      hidden.add(record.move.end);
      if (a.captured && a.capturedSquare !== null) ghosts.push([a.captured.kind, paletteFor(a.captured.color), tl(a.capturedSquare)]);
    }
    if (a.rookMove) {

      if (rook) { items.push(["R", paletteFor(rook.color), tl(from), tl(to)]); hidden.add(to); }

    else if (record.isCheck) s.play("check");
    else if (a.isPromotion) s.play("promote");
    else if (a.isCastle) s.play("castle");

    else { order = PROMOTION_CHOICES.slice().reverse(); top = BOARD_Y + 4 * SQ; cancel = new Rect(x, top - 34, SQ, 34); }
    const options = order.map((k, i) => [k, new Rect(x, top + i * SQ, SQ, SQ)]);

    this.promotion = null; this.deselect();

  openDialog(d) { this.dialog = d; this.clock.pause(); this.drag = null; }
  requestLeave() {
    if (this.game.isOver) return this.app.go("HOME");

    if (this.tokensDirty) this.rebuildTokens();

      if (i % 2 === 0) { const t = `${i / 2 + 1}.`, w = textWidth(t, nf); tokens.push({ kind: "num", text: t, x, w }); x += w + 6; }

    this.drawBoard(app);

    this.drawBtn.draw(app, C.TEXT_2, 26);

  drawPlayerBar(app, y, color) {

    const avatar = new Rect(16, y + 14, 48, 48);
    fillRounded(C.AVATAR_BG, avatar, 4);
    drawPieceCentered("P", "avatar", 42, avatar.cx, avatar.cy + 1);
    ctx.beginPath(); ctx.arc(avatar.right - 2, avatar.bottom - 2, 8, 0, 7); ctx.fillStyle = css(C.BG_MAIN); ctx.fill();
    ctx.beginPath(); ctx.arc(avatar.right - 2, avatar.bottom - 2, 6, 0, 7); ctx.fillStyle = css(PALETTES[paletteFor(color)].fill); ctx.fill();
    const nf = font(19, true);
    blitText(truncate(g.playerName(color), nf, 300), nf, C.TEXT, "topleft", 76, y + 10);

    const enemyPal = color === WHITE ? "captured_black" : "white", captured = g.capturedBy(color);
    let x = 76; const cy = y + 52;
    for (const k of CAPTURE_ORDER) {
      const n = captured.filter((c) => c === k).length;
      if (!n) continue;
      for (let i = 0; i < n; i++) { drawPiece(k, enemyPal, 22, x, cy - 11); x += 9; }
      x += 15;
    }
    const lead = g.materialAdvantage(color);
    if (lead > 0) blitText(`+${lead}`, font(15, true), C.TEXT_MUTED, "midleft", x + (captured.length ? 4 : 0), cy);

    const remaining = this.clock.timeLeft(color), low = remaining < LOW_TIME_THRESHOLD;
    const box = new Rect(W - 16 - 150, y + 14, 150, 48);
    let bg, fg;
    if (active) { bg = low ? C.TIMER_URGENT_BG : C.TIMER_ACTIVE_BG; fg = C.TIMER_ACTIVE_TEXT; }
    else { bg = C.TIMER_INACTIVE_BG; fg = low ? C.TIMER_URGENT_TEXT : C.TIMER_INACTIVE_TEXT; }
    fillRounded(bg, box, 6);
    if (active) drawIcon("clock", box.x + 22, box.cy, 20, fg, { angle: (Math.floor(remaining) % 4) * 90, filled: true, hand: bg });
    this.drawClockDigits(ChessClock.format(remaining), font(30, true), fg, box.right - 14, box.cy + 1);
  }
  drawBoard(app) {
    const g = this.game, board = g.board;
    const cf = font(15, true);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const light = (r + c) % 2 === 0;
      ctx.fillStyle = css(light ? C.LIGHT : C.DARK);
      ctx.fillRect(c * SQ, BOARD_Y + r * SQ, SQ, SQ);
      const tc = light ? C.DARK : C.LIGHT;
      if (c === 0) blitText(String(8 - r), cf, tc, "topleft", c * SQ + 5, BOARD_Y + r * SQ + 2);
      if (r === 7) blitText(FILES[c], cf, tc, "bottomright", c * SQ + SQ - 5, BOARD_Y + r * SQ + SQ - 1);
    }
    const tint = (s, [col, a]) => { const rr = squareRect(s); ctx.fillStyle = css(col, a); ctx.fillRect(rr.x, rr.y, rr.w, rr.h); };
    const last = g.lastMove();
    if (last) { tint(last.move.start, C.LAST_MOVE); tint(last.move.end, C.LAST_MOVE); }
    if (this.selected !== null) tint(this.selected, C.SELECTED);

    let checkSq = null;
    if (g.isOver && g.status === CHECKMATE) checkSq = board.findKing(g.turn);
    else if (!g.isOver) checkSq = g.checkedKingSquare();
    if (checkSq !== null) {
      const rr = squareRect(checkSq);
      const grad = ctx.createRadialGradient(rr.cx, rr.cy, 0, rr.cx, rr.cy, SQ * 0.72);
      for (let i = 0; i <= 10; i++) grad.addColorStop(i / 10, css(C.CHECK, C.CHECK_ALPHA * (1 - (i / 10) ** 2.2)));
      ctx.save(); ctx.beginPath(); ctx.rect(rr.x, rr.y, rr.w, rr.h); ctx.clip();
      ctx.fillStyle = grad; ctx.fillRect(rr.x, rr.y, rr.w, rr.h); ctx.restore();
    }

    const hidden = new Set(this.anim ? this.anim.hidden : []);
    if (this.drag && this.drag.active) hidden.add(this.drag.origin);
    if (this.promotion) hidden.add(this.promotion.start);
    if (this.anim) for (const [k, p, [x, y]] of this.anim.ghosts) drawPiece(k, p, SQ, x, y);

    let hoverPiece = false;
    const ms = squareAt(app.mouse);
    for (const [s, p] of board.pieces()) {
      if (hidden.has(s)) continue;
      const rr = squareRect(s);
      drawPiece(p.kind, paletteFor(p.color), SQ, rr.x, rr.y);
      if (s === ms && p.color === g.turn && !g.isOver) hoverPiece = true;
    }
    if (this.selected !== null && !g.isOver) {
      for (const t of this.targets) {
        const rr = squareRect(t);
        ctx.beginPath();
        if (board.pieceAt(t)) { ctx.arc(rr.cx, rr.cy, SQ * 0.48 - SQ * 0.0425, 0, 7); ctx.lineWidth = SQ * 0.085; ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.stroke(); }
        else { ctx.arc(rr.cx, rr.cy, SQ * 0.16, 0, 7); ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fill(); }
      }
      if (ms !== null && this.targets.has(ms)) hoverPiece = true;
    }
    if (this.drag && this.drag.active) {
      const hs = squareAt(this.drag.pos);
      if (hs !== null) { const rr = squareRect(hs); ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 4; ctx.strokeRect(rr.x + 2, rr.y + 2, SQ - 4, SQ - 4); }
    }
    if (this.anim) {
      const p = easeOutCubic(this.anim.t / MOVE_ANIM);
      for (const [k, pal, [x0, y0], [x1, y1]] of this.anim.items) drawPiece(k, pal, SQ, lerp(x0, x1, p), lerp(y0, y1, p));
    }
    if (this.drag && this.drag.active) {
      const p = board.pieceAt(this.drag.origin);
      if (p) { drawPiece(p.kind, paletteFor(p.color), SQ, this.drag.pos[0] - SQ / 2, this.drag.pos[1] - SQ / 2); hoverPiece = true; }
    }
    if (hoverPiece && !this.promotion && !this.dialog) app.handCursor = true;
  }
  drawPromotion(app) {
    const p = this.promotion;
    drawShadow(p.card, 4, 18, 150, [0, 6]);
    fillRounded([255, 255, 255], p.card, 4);
    const pal = paletteFor(p.color);
    for (const [k, r] of p.options) {
      if (r.contains(app.mouse)) { fillRounded([236, 234, 230], r, 4); app.handCursor = true; }
      drawPiece(k, pal, SQ, r.x, r.y);
    }
    fillRounded(p.cancel.contains(app.mouse) ? [232, 230, 227] : [244, 243, 241], p.cancel, 4);
    drawIcon("close", p.cancel.cx, p.cancel.cy, 16, [120, 118, 115]);
  }
  drawResultModal(app) {
    const g = this.game, m = this.resultModal, card = m.card;
    ctx.fillStyle = "rgba(0,0,0,0.43)"; ctx.fillRect(0, 0, W, H);
    drawShadow(card, 16, 24, 180, [0, 12]);
    fillRounded(C.BG_SURFACE, card, 16);
    const bandColor = g.outcome.winner ? C.DARK : C.BG_RAISED_2;
    ctx.save(); roundRectPath(ctx, card.x, card.y, card.w, card.h, 16); ctx.clip();
    ctx.fillStyle = css(bandColor); ctx.fillRect(card.x, card.y, card.w, 104); ctx.restore();
    const hf = font(30, true);
    blitText(truncate(g.resultHeadline(), hf, card.w - 80), hf, C.TEXT, "midtop", card.cx, card.y + 20);
    blitText(g.resultReason(), font(17), [245, 236, 224], "midtop", card.cx, card.y + 62);
    const result = g.outcome.result;
    const scores = result === "1/2-1/2" ? ["½", "½"] : result.split("-");
    [WHITE, BLACK].forEach((color, i) => {
      const cx = card.cx + (i === 0 ? -110 : 110);
      const tile = Rect.centered(cx, card.y + 156, 64, 64);
      fillRounded(color === WHITE ? C.LIGHT : C.DARK, tile, 10);
      if (g.outcome.winner === color) fillRounded([245, 246, 130], tile.inflate(6, 6), 12, 3);
      drawPieceCentered("K", paletteFor(color), 58, tile.cx, tile.cy);
      const nf = font(15, true);
      blitText(truncate(g.playerName(color), nf, 150), nf, C.TEXT_2, "midtop", cx, tile.bottom + 8);
    });
    blitText(`${scores[0]}  –  ${scores[1]}`, font(34, true), C.TEXT, "center", card.cx, card.y + 156);
    blitText(`${g.fullmoveCount()} moves`, font(14), C.TEXT_MUTED, "center", card.cx, card.y + 188);
    m.rematch.draw(app); m.newGame.draw(app); m.home.draw(app);
    m.close.draw(app, [245, 236, 224], 20);
  }
}

class HistoryScreen extends Screen {
  constructor(app) {
    super(app);
    this.CARD_H = 108; this.GAP = 12; this.MARGIN = 16; this.LIST_TOP = HEADER_H + 52;
    this.backBtn = new IconButton(new Rect(8, 8, 40, 40), "back", "Back");
    this.clearBtn = new IconButton(new Rect(W - 48, 8, 40, 40), "trash", "Clear all history");
    this.playBtn = new Button(new Rect(W / 2 - 140, 520, 280, 60), "Play a Game", "primary", 21);
    this.view = new Rect(0, this.LIST_TOP, W, H - this.LIST_TOP);
    this.matches = []; this.loading = true;
    this.scroll = 0; this.target = 0; this.dragFrom = null; this.pressedDelete = null; this.dialog = null;
    this.reload();
  }
  reload() {
    this.app.history.load().then((list) => {
      this.matches = list; this.loading = false;
      this.target = clamp(this.target, 0, this.maxScroll()); this.scroll = clamp(this.scroll, 0, this.maxScroll());
    });
  }
  get contentHeight() { return this.MARGIN + this.matches.length * (this.CARD_H + this.GAP); }
  maxScroll() { return Math.max(0, this.contentHeight - this.view.h + this.MARGIN); }
  cardRect(i) { return new Rect(this.MARGIN, this.view.y + this.MARGIN - Math.round(this.scroll) + i * (this.CARD_H + this.GAP), W - 2 * this.MARGIN, this.CARD_H); }
  deleteRect(card) { return new Rect(card.right - 46, card.y + 10, 34, 34); }
  deleteHit(pos) {
    if (!this.view.contains(pos)) return null;
    for (let i = 0; i < this.matches.length; i++) if (this.deleteRect(this.cardRect(i)).contains(pos)) return i;
    return null;
  }
  askDelete(i) {
    const m = this.matches[i];
    this.dialog = new ConfirmDialog("Delete Match?", [`${m.white || "?"} vs ${m.black || "?"}`, `Played ${relativeTime(m.timestamp || 0).toLowerCase()}`],
      "Delete", () => { this.matches = this.matches.filter((x) => x !== m); this.app.history.remove(m.id).then(() => this.reload()); this.dialog = null; },
      "Cancel", () => (this.dialog = null), "danger");
  }
  askClear() {
    const n = this.matches.length;
    this.dialog = new ConfirmDialog("Clear All History?", [`All ${n} saved match${n !== 1 ? "es" : ""} will be deleted.`, "This cannot be undone."],
      "Delete All", () => { const all = this.matches; this.matches = []; this.app.history.clear(all).then(() => this.reload()); this.dialog = null; },
      "Cancel", () => (this.dialog = null), "danger");
  }
  handle(ev) {
    if (this.dialog) { if (this.dialog.handle(ev)) this.dialog = null; return; }
    if (this.backBtn.handle(ev)) return this.app.go("HOME");
    if (!this.loading && !this.matches.length && this.playBtn.handle(ev)) return this.app.go("SETUP");
    this.clearBtn.visible = this.matches.length > 0;
    if (this.clearBtn.handle(ev)) return this.askClear();
    if (ev.type === "down" && ev.button === 0) {
      const hit = this.deleteHit(ev.pos);
      if (hit !== null) { this.pressedDelete = hit; return; }
    } else if (ev.type === "up" && ev.button === 0 && this.pressedDelete !== null) {
      const p = this.pressedDelete; this.pressedDelete = null;
      if (this.deleteHit(ev.pos) === p) this.askDelete(p);
      return;
    }
    if (ev.type === "key") {
      const step = { ArrowUp: -60, ArrowDown: 60, PageUp: -this.view.h + 60, PageDown: this.view.h - 60 }[ev.key];
      if (ev.key === "Escape") this.app.go("HOME");
      else if (ev.key === "Home") this.target = 0;
      else if (ev.key === "End") this.target = this.maxScroll();
      else if (step) this.target = clamp(this.target + step, 0, this.maxScroll());
    } else if (ev.type === "wheel") this.target = clamp(this.target + ev.dy, 0, this.maxScroll());
    else if (ev.type === "down" && ev.button === 0) { if (this.view.contains(ev.pos)) this.dragFrom = [ev.pos[1], this.target]; }
    else if (ev.type === "move" && this.dragFrom) { this.target = this.scroll = clamp(this.dragFrom[1] - (ev.pos[1] - this.dragFrom[0]), 0, this.maxScroll()); }
    else if (ev.type === "up") this.dragFrom = null;
  }
  update(dt) { this.scroll = lerp(this.scroll, this.target, clamp(dt * 14)); }
  draw(app) {
    ctx.fillStyle = css(C.BG_MAIN); ctx.fillRect(0, 0, W, H);
    drawHeader(app, "Match History", this.backBtn);
    this.clearBtn.visible = this.matches.length > 0;
    this.clearBtn.draw(app, C.TEXT_2, 24);
    const total = this.matches.length, decisive = this.matches.filter((m) => m.winner).length;
    let summary = this.loading ? "Loading matches..." : `${total} match${total !== 1 ? "es" : ""}`;
    if (total) summary += `  ·  ${decisive} decisive  ·  ${total - decisive} drawn`;
    blitText(summary, font(15, true), C.TEXT_MUTED, "midleft", this.MARGIN + 4, HEADER_H + 26);
    if (!this.loading) {
      const where = app.history.mode === "cloud" ? "Saved to your account" : "Saved in this browser";
      blitText(where, font(14), C.TEXT_MUTED, "midright", W - this.MARGIN - 4, HEADER_H + 26);
    }
    if (!this.loading && !total) this.drawEmpty(app);
    else if (total) {
      ctx.save(); ctx.beginPath(); ctx.rect(this.view.x, this.view.y, this.view.w, this.view.h); ctx.clip();
      const interactive = !this.dialog && this.view.contains(app.mouse);
      this.matches.forEach((m, i) => {
        const r = this.cardRect(i);
        if (r.bottom < this.view.y || r.y > this.view.bottom) return;
        this.drawCard(r, m, interactive && r.contains(app.mouse));
        const bin = this.deleteRect(r), bh = interactive && bin.contains(app.mouse);
        if (bh) { app.handCursor = true; fillRounded(C.BTN_DANGER, bin, 8); }
        drawIcon("trash", bin.cx, bin.cy, 20, bh ? C.TEXT : C.TEXT_MUTED);
      });
      ctx.restore();
      const ms = this.maxScroll();
      if (ms > 0) {
        const track = this.view.h - 16, thumb = Math.max(40, track * this.view.h / (this.contentHeight + this.MARGIN));
        const ty = this.view.y + 8 + (track - thumb) * clamp(this.scroll / ms);
        fillRounded(C.BG_RAISED_2, new Rect(W - 7, ty, 4, thumb), 2);
      }
    }
    if (this.dialog) this.dialog.draw(app);
    else { this.clearBtn.drawTooltip(app); this.backBtn.drawTooltip(app); }
  }
  drawCard(rect, m, hover) {
    fillRounded(hover ? C.BG_RAISED : C.BG_SURFACE, rect, 10);
    const winner = m.winner, result = m.result || "*";
    const badge = new Rect(rect.x + 16, rect.y + 22, 64, 64);
    let bbg = C.BG_RAISED_2, bfg = C.TEXT;
    if (winner === "white") { bbg = C.LIGHT; bfg = C.TEXT_DARK; } else if (winner === "black") bbg = C.BG_DEEP;
    fillRounded(bbg, badge, 10);
    if (winner === "black") fillRounded(C.BG_RAISED_2, badge, 10, 2);
    blitText(result === "1/2-1/2" ? "½-½" : result, font(19, true), bfg, "center", badge.cx, badge.cy);
    const nf = font(18, true), top = rect.y + 18;
    let x = badge.right + 18;
    [["white", PALETTES.white.fill], ["black", PALETTES.black.fill]].forEach(([key, fill], i) => {
      if (i === 1) x = blitText("vs", font(15), C.TEXT_MUTED, "midleft", x, top + 11).right + 10;
      ctx.beginPath(); ctx.arc(x + 7, top + 11, 8, 0, 7); ctx.fillStyle = css(C.BG_DEEP); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 7, top + 11, 6, 0, 7); ctx.fillStyle = css(fill); ctx.fill();
      const name = truncate(String(m[key] || "?"), nf, 150);
      x = blitText(name, nf, winner === key || !winner ? C.TEXT : C.TEXT_2, "midleft", x + 20, top + 11).right + 10;
    });
    const reason = m.reason_text || "";
    let line;
    if (winner) line = `${m[winner] || winner} won ${reason}`.trim();
    else if (reason.startsWith("by ") || reason.startsWith("on ")) line = `Draw ${reason}`;
    else line = reason ? `Draw · ${reason}` : "Draw";
    const lf = font(16);
    blitText(truncate(line, lf, rect.right - badge.right - 40), lf, C.TEXT_2, "topleft", badge.right + 18, rect.y + 46);
    const moves = m.move_count || 0;
    let details = `${moves} move${moves !== 1 ? "s" : ""}`;
    if (m.duration_seconds) { const d = Math.floor(m.duration_seconds); details += `  ·  ${Math.floor(d / 60)}m ${String(d % 60).padStart(2, "0")}s`; }
    blitText(details, font(14), C.TEXT_MUTED, "topleft", badge.right + 18, rect.y + 74);
    blitText(relativeTime(m.timestamp || 0), font(14, true), C.TEXT_MUTED, "topright", rect.right - 16, rect.y + 76);
  }
  drawEmpty(app) {
    drawPieceCentered("R", "splash_dark", 140, W / 2, 300);
    blitText("No matches yet", font(24, true), C.TEXT, "midtop", W / 2, 390);
    blitText("Finished games are saved here automatically.", font(16), C.TEXT_MUTED, "midtop", W / 2, 428);
    this.playBtn.draw(app);
  }
}

/* ================================================================== app */
class App {
  constructor(data) {
    this.wrap = document.getElementById("wrap");
    this.box = document.getElementById("box");
    this.stage = document.getElementById("stage");
    this.canvas = document.getElementById("board");
    ctx = this.canvas.getContext("2d");
    this.fields = [...document.querySelectorAll(".field")].map((wrap) => ({ wrap, input: wrap.querySelector("input") }));
    this.sound = new SoundManager();
    this.history = new HistoryStore();
    this.playerNames = (data && data.names) || ["", ""];
    this.p1White = data && typeof data.p1White === "boolean" ? data.p1White : true;
    this.mouse = [-1, -1]; this.pointerType = "mouse"; this.handCursor = false;
    this.screen = null; this.state = null; this.pending = null; this.fade = null;
    this.SCREENS = { HOME: HomeScreen, SETUP: SetupScreen, GAME: GameScreen, HISTORY: HistoryScreen };
    this.layout();
    new ResizeObserver(() => this.layout()).observe(this.wrap);
    window.addEventListener("resize", () => this.layout());
    this.bindEvents();
    if (data && data.game) { this.go("GAME", { white: data.game.white, black: data.game.black, restore: data.game }); }
    else this.go("HOME");
    this.applyPending(false);
    this.blocked = !(data && (data.game || data.state));   // true while the intro video plays
    if (this.blocked) runIntro(this); else removeIntro();
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  }
  layout() {
    const cs = getComputedStyle(this.wrap);
    const aw = this.wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = this.wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const s = Math.max(0.2, Math.min(aw / W, ah / H, 1.6));
    this.scale = s;
    this.box.style.width = W * s + "px"; this.box.style.height = H * s + "px";
    this.stage.style.transform = `scale(${s})`;
    const px = s * (window.devicePixelRatio || 1);
    if (Math.abs(px - PX) > 1e-3 || !this.canvas.width) {
      PX = px;
      this.canvas.width = Math.round(W * PX); this.canvas.height = Math.round(H * PX);
      pieceCache.clear(); prewarmQueue = PREWARM.slice();
    }
  }
  toLogical(e) {
    const r = this.canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  }
  dispatch(ev) {
    if (this.pending || this.blocked) return;
    if (this.fade && (ev.type === "down" || ev.type === "up")) return;
    this.screen.handle(ev);
  }
  bindEvents() {
    const cv = this.canvas;
    cv.addEventListener("pointerdown", (e) => {
      this.sound.unlock();
      this.pointerType = e.pointerType || "mouse";
      if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      this.mouse = this.toLogical(e);
      this.dispatch({ type: "down", pos: this.mouse, button: e.button === 2 ? 2 : e.button === 0 ? 0 : 1 });
    });
    cv.addEventListener("pointermove", (e) => {
      this.pointerType = e.pointerType || "mouse";
      this.mouse = this.toLogical(e);
      this.dispatch({ type: "move", pos: this.mouse });
    });
    const up = (e) => {
      this.mouse = this.toLogical(e);
      this.dispatch({ type: "up", pos: this.mouse, button: e.button === 2 ? 2 : e.button === 0 ? 0 : 1 });
      if (e.pointerType === "touch") this.mouse = [-1, -1];
    };
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    cv.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !e.buttons) this.mouse = [-1, -1]; });
    cv.addEventListener("contextmenu", (e) => e.preventDefault());
    cv.addEventListener("wheel", (e) => {
      e.preventDefault();
      const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 600 : 1;
      this.dispatch({ type: "wheel", pos: this.toLogical(e), dx: e.deltaX * k / this.scale, dy: e.deltaY * k / this.scale });
    }, { passive: false });
    window.addEventListener("keydown", (e) => {
      this.sound.unlock();
      const inInput = e.target && e.target.tagName === "INPUT";
      if (inInput && !["Enter", "Escape"].includes(e.key)) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", " ", "Home", "End"].includes(e.key)) e.preventDefault();
      if (e.key === "Enter" && inInput) e.preventDefault();
      this.dispatch({ type: "key", key: e.key });
    });
    for (const f of this.fields) f.input.addEventListener("pointerdown", () => this.sound.unlock());
  }
  go(state, opts = {}) { this.pending = [state, opts]; }
  applyPending(fade = true) {
    if (!this.pending) return;
    const [state, opts] = this.pending;
    this.pending = null;
    if (this.screen) {
      this.screen.exit();
      if (fade) {
        const snap = document.createElement("canvas");
        snap.width = this.canvas.width; snap.height = this.canvas.height;
        snap.getContext("2d").drawImage(this.canvas, 0, 0);
        this.fade = { snap, t: 0 };
      }
    }
    this.screen = new this.SCREENS[state](this, opts);
    this.state = state;
    this.screen.enter();
  }
  snapshot() {
    if (this.state === "GAME" && this.screen.snapshot) {
      const g = this.screen.snapshot();
      if (g) return { game: g, names: this.playerNames, p1White: this.p1White };
    }
    return { state: "HOME", names: this.playerNames, p1White: this.p1White };
  }
  frame(now) {
    const dt = Math.min((now - this.last) / 1000, 0.1);
    this.last = now;
    prewarmStep(4);
    this.screen.update(dt);
    this.handCursor = false;
    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    ctx.globalAlpha = 1;
    this.screen.draw(this);
    if (this.fade) {
      this.fade.t += dt;
      const p = this.fade.t / FADE;
      if (p >= 1) this.fade = null;
      else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1 - easeInOut(p);
        ctx.drawImage(this.fade.snap, 0, 0, this.canvas.width, this.canvas.height);
        ctx.globalAlpha = 1;
      }
    }
    this.canvas.style.cursor = this.handCursor ? "pointer" : "default";
    this.applyPending();
    requestAnimationFrame((t) => this.frame(t));
  }
}


/* ================================================================ intro */
/* Full-window logo video that starts by itself (same behaviour as Chrono Calc).
   It tries to play with sound; browsers that block that play it muted.
   Esc / Enter / Space end it early. */
function removeIntro() { const el = document.getElementById("intro"); if (el) el.remove(); }
function runIntro(app) {
  const intro = document.getElementById("intro");
  if (!intro) { app.blocked = false; return; }
  const video = intro.querySelector("video");
  let done = false;
  const timers = [];
  const finish = () => {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    intro.classList.add("leaving");
    try { video.pause(); } catch (e) {}
    app.blocked = false;
    setTimeout(removeIntro, REDUCED_MOTION ? 0 : 600);
  };
  video.addEventListener("playing", () => intro.classList.add("playing"));
  video.addEventListener("ended", finish);
  video.addEventListener("error", finish);
  const sources = video.querySelectorAll("source");
  if (sources.length) sources[sources.length - 1].addEventListener("error", finish);

  window.addEventListener("keydown", (e) => {
    if (done) return;
    if (["Escape", "Enter", " "].includes(e.key)) { e.preventDefault(); app.sound.unlock(); finish(); }
  });

  // if playback never really starts, don't hold the game hostage
  timers.push(setTimeout(() => { if (!video.currentTime) finish(); }, 3500));
  // hard cap a little past the clip's own 4 s
  timers.push(setTimeout(finish, 8000));

  video.muted = false;
  const playMuted = () => {
    video.muted = true;
    return video.play();
  };
  (app.sound.muted ? playMuted() : video.play().catch((err) => {
    if (err && err.name === "NotSupportedError") throw err;
    return playMuted();
  })).catch(finish);
}

/* ================================================================= boot */
let APP = null;
function boot(data) { if (!APP) APP = new App(data || {}); }
(function start() {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === "function") hot.snapshot(() => (APP ? APP.snapshot() : {})); } catch (e) {}
  const go = () => {
    if (hot && typeof hot.ready === "function") hot.ready(boot);
    else boot((hot && hot.data) || {});
  };
  if (document.fonts && document.fonts.load) {
    Promise.race([
      Promise.all([document.fonts.load(font(20, true)), document.fonts.load(font(20))]),
      new Promise((r) => setTimeout(r, 1500)),
    ]).then(go, go);
  } else go();
})();
</script>
